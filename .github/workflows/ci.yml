name: CI

on:
  push:
    branches: [main, next]
  pull_request:

jobs:
  backend:
    name: Бэкенд — тесты
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://mindset:mindset@127.0.0.1:5432/mindset
      JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: back/src/go.sum
      - name: go test
        working-directory: back/src
        run: go test ./...

  schema:
    name: Схема БД — чистая база и повторное применение
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mindset
          POSTGRES_PASSWORD: mindset-ci-password
          POSTGRES_DB: mindset
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mindset -d mindset"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: Применить schema.sql дважды
        env:
          PGPASSWORD: mindset-ci-password
        run: |
          for run in 1 2; do
            echo "прогон $run"
            psql -h 127.0.0.1 -U mindset -d mindset -v ON_ERROR_STOP=1 -f back/src/db/schema.sql
          done

  frontend:
    name: Фронтенд — тесты и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: npm ci
        working-directory: front
        run: npm ci
      - name: npm test
        working-directory: front
        env:
          CI: 'true'
        run: npm test -- --watchAll=false
      - name: npm run build
        working-directory: front
        env:
          CI: 'true'
          PUBLIC_URL: /mindset
          REACT_APP_BASE_API_URL: /mindset/api
        run: npm run build

  images:
    name: Образы — сборка
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, schema, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: backend
        run: docker build -t mindset-backend:ci ./back
      - name: frontend
        run: >-
          docker build -t mindset-frontend:ci
          --build-arg PUBLIC_URL=/mindset
          --build-arg REACT_APP_BASE_API_URL=/mindset/api
          ./front
