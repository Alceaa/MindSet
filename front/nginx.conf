server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-роутинг: любой путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кэшируем, чтобы обновления подхватывались сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Хэшированные ассеты можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        add_header Cache-Control "public, immutable";
        expires 30d;
        try_files $uri =404;
    }
}
